[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kasa"
version = "0.1.0"
description = "Kasa - segment finansowy Spinacza 2.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "lxml>=5",
    "openpyxl>=3.1",
    "pypdf>=5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kasa*"]

[tool.setuptools.package-data]
"kasa.extensions" = ["*/extension.yaml", "*/hooks.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
