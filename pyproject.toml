[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kasa"
version = "0.1.0"
description = "Kasa - segment finansowy Spinacza 2.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "lxml>=5",
    "openpyxl>=3.1",
    "pypdf>=5",
    "cryptography>=42",
]

[project.optional-dependencies]
# panel WWW (python -m kasa web): etykietowanie zbiorów kontrolnych, w fazie 4 kolejka przeglądu
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["kasa*"]

[tool.setuptools.package-data]
"kasa.extensions" = ["*/extension.yaml", "*/hooks.py"]
"kasa.web" = ["templates/*.html", "templates/*/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
