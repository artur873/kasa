# Rozszerzenie ODM Partners. Obiekt kosztowy ODM to event:
# klient + zwarte okno dat + miasto + nazwa (briefing, krok 5).
# Lista eventów nie jest importowana - kandydaci powstają z danych,
# człowiek zatwierdza ich w karcie (decyzja D1).
slug: odm
name: ODM Partners
description: Agencja eventowa; marża liczona per event.

cost_object:
  kind: event
  label: Event
  name_template: "{name}"
  attrs:
    name:       {type: text, required: true, label: Nazwa eventu}
    client:     {type: text, required: true, label: Klient}
    date_start: {type: date, required: true, label: Początek}
    date_end:   {type: date, required: true, label: Koniec}
    city:       {type: text, label: Miasto}

# Lista startowa z briefingu (kroki 4-5, decyzja D9); do potwierdzenia przez użytkownika.
categories:
  - IT/SaaS
  - Czynsz biura
  - ZUS
  - PIT od umów cywilnoprawnych
  - Podatki (US)
  - Prowizje bankowe
  - Zaliczki
  - Kaucje
  - Noclegi
  - Personel eventowy
  - Inne

import_mappings:
  # Arkusz PM: rozliczenie wewnętrzne, np. "Kowalska, 12.03, Allegro, 450".
  # To dokument, ale nie twardy dowód alokacji, dopóki nie dojrzeje reguła (D2).
  pm_sheet:
    target: internal_record
    description: Arkusz PM - kto, kiedy, przy którym evencie, ile i jak rozliczony
    file_types: [xlsx, csv]
    columns:
      person:          {source: osoba, required: true}
      record_date:     {source: data, type: date, required: true}
      cost_object_ref: {source: event, required: true}
      amount:          {source: kwota, type: amount, required: true}
      # Pole pod v2 (D9): ZUS i PIT od umów cywilnoprawnych w v1 idą do UNASSIGNED.
      settlement_type: {source: typ_rozliczenia}

  # Eksport rejestru VAT z programu biura (CSV Windows-1250, separator ";", przecinek
  # dziesiętny, daty DD.MM.RRRR). Kolumna "typ" niesie naraz kierunek i rodzaj
  # ("sprzedaż", "zakup", "import usług", "korekta sprzedaży"); "kontrahent" i "NIP"
  # to druga strona dokumentu (nabywca sprzedaży, sprzedawca zakupu).
  document:
    target: document
    description: Eksport rejestru VAT z programu biura - numer, data, kontrahent, NIP, kwoty, typ
    file_types: [csv, xlsx]
    columns:
      number_raw:        {source: numer, aliases: [numer dokumentu, nr dokumentu, numer faktury], required: true}
      issue_date:        {source: data, aliases: [data wystawienia, data dokumentu], type: date, required: true}
      sale_date:         {source: data sprzedaży, type: date}
      due_date:          {source: termin płatności, type: date}
      counterparty_name: {source: kontrahent, aliases: [nazwa kontrahenta]}
      counterparty_nip:  {source: nip, aliases: [nip kontrahenta]}
      net:               {source: netto, type: amount}
      vat:               {source: vat, aliases: [kwota vat], type: amount}
      gross:             {source: brutto, type: amount, required: true}
      kind:              {source: typ, aliases: [rodzaj, typ dokumentu]}
      currency:          {source: waluta}
      ksef_number:       {source: numer ksef, aliases: [nr ksef]}

# Dopisywane do listy bazowej rdzenia (zdrowie, związki, komornik, alimenty).
sensitive_words:
  - związek zawodowy
  - komornicze
  - zajęcie komornicze
  - chorobowe
  - zwolnienie lekarskie
