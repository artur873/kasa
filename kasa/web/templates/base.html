<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kasa{% endblock %}</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dddcd6; --accent: #1f5f8b;
          --ok: #2e7d4f; --warn: #a35a00; --bad: #a32020; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3a36; --accent: #6fb0dd; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 16px; }
  .amount { font-size: 30px; font-weight: 650; letter-spacing: -0.5px; }
  .amount.in { color: var(--ok); }
  .muted { color: var(--muted); font-size: 15px; }
  .title { font-size: 18px; word-break: break-word; margin: 8px 0; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 15px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; word-break: break-word; }
  .progress { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 16px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 600; margin-bottom: 8px; }
  .choices { display: grid; gap: 8px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; inset: 0; }
  .choice span { display: block; padding: 14px 12px; min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px;
                 background: var(--card); font-weight: 550; }
  .choice input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doc span { font-weight: 450; font-size: 15px; }
  .only-matched, .only-nodoc { display: none; }
  form:has(#status-matched:checked) .only-matched { display: block; }
  form:has(#status-no_document:checked) .only-nodoc { display: block; }
  input[type=text], input[type=search], input[type=number], select, textarea {
    width: 100%; font: inherit; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  textarea { min-height: 72px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button, .button { display: block; width: 100%; padding: 16px; font: inherit; font-weight: 650; border: 0; border-radius: 12px;
                    background: var(--accent); color: #fff; text-align: center; text-decoration: none; cursor: pointer; }
  .button.secondary, button.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .error { background: #fbe9e9; color: var(--bad); padding: 12px; border-radius: 10px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  .lines { margin: 8px 0 0; padding-left: 18px; font-size: 15px; }
  header nav a { margin: 0 2px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600;
           border: 1px solid var(--line); }
  .badge.high { color: var(--ok); border-color: var(--ok); }
  .badge.medium { color: var(--warn); border-color: var(--warn); }
  .badge.low { color: var(--muted); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 13px; }
  .proposal { margin: 0 0 10px; }
  .proposal button { text-align: left; font-weight: 600; }
  .proposal ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .actions form, .actions a { margin: 0; }
  .toast { position: sticky; top: 0; z-index: 5; background: var(--ink); color: var(--bg); padding: 12px 14px;
           border-radius: 12px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .toast button { width: auto; padding: 10px 14px; background: var(--bg); color: var(--ink); }
  details summary { cursor: pointer; color: var(--accent); }
  .small { font-size: 14px; }
</style>
</head>
<body>
<header><a href="/queue">Kasa</a><nav class="muted"><a href="/queue">Kolejka</a> · <a href="/queue/history">Historia</a> · <a href="/queue/stats">KPI</a> · <a href="/dashboard">Liczby</a> · <a href="/control-sets">Zbiory</a></nav><span class="muted">{% block where %}{% endblock %}</span></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
